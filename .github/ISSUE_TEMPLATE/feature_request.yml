name: Feature request
description: Suggest a feature you'd like or a behavior you'd like changed.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        You can write in English or Korean.
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
      description: Describe the situation and what you want to do.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Describe how you do it now with Pullshot or other tools, and what's inconvenient.
  - type: textarea
    id: idea
    attributes:
      label: Suggestion
      description: If you have an approach in mind, describe it. Feel free to attach screenshots or sketches for reference.
