name: Bug report
description: Report a problem with connecting, importing, or the app's screens.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If you can reproduce the problem, turn on "Detailed logging" in Settings and try again before reporting. Logs don't include file names, game names, paths, or serial numbers. You can write in English or Korean.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you were doing and what went wrong. If the app showed a message, paste it as is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect the Switch and turn on Copy to PC.
        2. Select a folder in the sidebar.
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: dropdown
    id: console
    attributes:
      label: Console
      options:
        - Nintendo Switch 2
        - Nintendo Switch (experimental)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Console system version
      description: You can find it in System Settings > System on the console. While the console is connected, it's also shown at the top of the app's sidebar.
      placeholder: "e.g. 23.5.0"
  - type: dropdown
    id: surface
    attributes:
      label: App or CLI
      options:
        - App
        - CLI (pullshot)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pullshot version
      description: In the app, choose About Pullshot in the Pullshot menu. If you built from source, enter the commit hash.
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: "e.g. MacBook Air M2, macOS 15.4"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: For the app, attach the pullshot.log file you find with Help > Show Log File. For the CLI, run the command again with --verbose and paste the output. CLI output includes file names and game names, and probe output includes the serial number, so redact them if needed.
