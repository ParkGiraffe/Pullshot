name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Install SwiftLint and SwiftFormat
        run: brew bundle
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - name: Lint and format check
        run: make check
      - name: Build
        run: make build
      - name: Test
        run: make test
